<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Ad A creative 1080x1350</title>
<style>
  /* Same visual system as the page: white, system sans, ink + muted, no accent colour needed here. */
  html, body { margin: 0; width: 1080px; height: 1350px; }
  body { background: #ffffff; color: #111418; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; padding: 96px 84px; box-sizing: border-box; }
  h1 { font-weight: 800; font-size: 92px; line-height: 1.04; letter-spacing: -0.025em; margin: 0 0 24px; text-wrap: balance; }
  .meta { font-size: 32px; color: #4a5360; margin: 0 0 72px; }
  .swap { display: flex; align-items: baseline; gap: 28px; font-weight: 800; font-size: 104px; letter-spacing: -0.01em; margin-bottom: 28px; }
  .from { color: #4a5360; }
  .arrow { color: #4a5360; font-weight: 400; font-size: 80px; }
  table { width: 100%; border-collapse: collapse; font-size: 38px; }
  th, td { padding: 26px 0; border-top: 2px solid #e3e7ec; text-align: left; }
  tr:last-child th, tr:last-child td { border-bottom: 2px solid #e3e7ec; }
  th { color: #4a5360; font-weight: 400; }
  td { font-weight: 700; text-align: right; }
  .no { color: #4a5360; font-weight: 400; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; font-size: 32px; color: #4a5360; }
  .logo { font-weight: 800; color: #111418; font-size: 40px; } .logo span { font-weight: 400; }
</style>
</head>
<body>
  <h1>VOO u většiny brokerů nekoupíte. Jeho dvojče ano.</h1>
  <p class="meta">Pro investory z Česka</p>
  <div class="swap"><span class="from">VOO</span><span class="arrow">→</span><span class="to">VUAA</span></div>
  <table>
    <tr><th>Index</th><td>S&amp;P 500 = S&amp;P 500</td></tr>
    <tr><th>Koupíte z Česka</th><td><span class="no">většinou ne</span> / ano</td></tr>
    <tr><th>Roční poplatek</th><td>0,03 % / 0,07 %</td></tr>
  </table>
  <div class="foot"><span class="logo">ETF<span>dvojčata</span></span><span>+ SPY, QQQ, VT a další</span></div>
</body>
</html>
